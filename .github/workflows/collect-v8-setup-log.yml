name: Collect HOTS v8 Setup Log

on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths: [.github/workflows/collect-v8-setup-log.yml]

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 0
      - name: Collect failed setup log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEST=build_reports/v8_setup_failure
          mkdir -p "$DEST"
          gh run view 37198999183 \
            --repo "$GITHUB_REPOSITORY" \
            --job 111426619387 \
            --log > "$DEST/job.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST/job.log"
          git commit -m "Add HOTS v8 setup failure log [skip ci]"
          git pull --rebase origin chatgpt-stl-builder
          git push origin HEAD:chatgpt-stl-builder
