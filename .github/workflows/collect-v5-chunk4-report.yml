name: Collect V5 Chunk 4 Report
on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths: [.github/workflows/collect-v5-chunk4-report.yml]
permissions:
  actions: read
  contents: write
jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 0
      - name: Download reports
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/chunk4"
          mkdir -p "$D"
          gh run download 37194356843 \
            --repo "$GITHUB_REPOSITORY" \
            --name HOTS-v5-fixed-chunk-4 \
            --dir "$D"
          DEST=build_reports/v5_chunk4
          mkdir -p "$DEST"
          find "$D/Reports" -type f -exec cp {} "$DEST/" \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Add v5 chunk 4 repair reports [skip ci]"
          git pull --rebase origin chatgpt-stl-builder
          git push origin HEAD:chatgpt-stl-builder
