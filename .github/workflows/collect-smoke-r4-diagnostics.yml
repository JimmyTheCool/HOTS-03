name: Collect Smoke R4 Diagnostics
on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths: [.github/workflows/collect-smoke-r4-diagnostics.yml]
permissions:
  actions: read
  contents: write
jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 0
      - name: Download and commit smoke diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/smoke_r4_artifact"
          mkdir -p "$RUNNER_TEMP/smoke_r4_artifact"
          gh run download 37192832023 \
            --repo "$GITHUB_REPOSITORY" \
            --name HOTS-v2-smoke-r4 \
            --dir "$RUNNER_TEMP/smoke_r4_artifact"
          DEST=build_reports/smoke_r4
          mkdir -p "$DEST"
          find "$RUNNER_TEMP/smoke_r4_artifact" -type f -maxdepth 3 -print
          find "$RUNNER_TEMP/smoke_r4_artifact" -type f -maxdepth 3 \
            -exec cp {} "$DEST/" \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add smoke R4 validation diagnostics [skip ci]"
          git pull --rebase origin chatgpt-stl-builder
          git push origin HEAD:chatgpt-stl-builder
