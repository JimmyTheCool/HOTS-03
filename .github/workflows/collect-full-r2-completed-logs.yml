name: Collect Full R2 Completed Logs
on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths: [.github/workflows/collect-full-r2-completed-logs.yml]
permissions:
  actions: read
  contents: write
jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 0
      - name: Collect completed failed matrix logs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          D=build_reports/debug_logs/full_r2_completed
          mkdir -p "$D"
          gh run view 37192482532 --repo "$GITHUB_REPOSITORY" --job 111407410515 --log > "$D/chunk1.log"
          gh run view 37192482532 --repo "$GITHUB_REPOSITORY" --job 111407410578 --log > "$D/chunk3.log"
          gh run view 37192482532 --repo "$GITHUB_REPOSITORY" --job 111407410508 --log > "$D/chunk4.log"
          gh run view 37192482532 --repo "$GITHUB_REPOSITORY" --job 111407410405 --log > "$D/chunk6.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$D"
          git commit -m "Add completed full R2 failure logs [skip ci]"
          git pull --rebase origin chatgpt-stl-builder
          git push origin HEAD:chatgpt-stl-builder
