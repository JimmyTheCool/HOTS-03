name: Repair and Package HOTS STL v6

on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths: [.github/workflows/repair-and-package-hots-v6.yml]

permissions:
  actions: read
  contents: write

env:
  RAW_BUILD_RUN_ID: 37193141976

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {chunk: 1, expected: 15}
          - {chunk: 2, expected: 15}
          - {chunk: 3, expected: 15}
          - {chunk: 4, expected: 15}
          - {chunk: 5, expected: 15}
          - {chunk: 6, expected: 16}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 1

      - name: Download complete raw chunk
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/raw_${{ matrix.chunk }}"
          mkdir -p "$RAW"
          gh run download "$RAW_BUILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "HOTS-v3-chunk-${{ matrix.chunk }}" \
            --dir "$RAW"
          test -d "$RAW/STL"
          test "$(find "$RAW/STL" -maxdepth 1 -type f -name '*.stl' | wc -l)" \
            -eq "${{ matrix.expected }}"
          find "$RAW/STL" -maxdepth 1 -type f -name '*.stl' -printf '%f\n' \
            | sort > "$RAW/raw_file_list.txt"

      - name: Install repair and validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            trimesh==4.8.3 numpy==2.2.6 scipy==1.15.3 \
            scikit-image==0.25.2 pymeshfix==0.18.1 \
            fast-simplification==0.1.12 matplotlib==3.10.1

      - name: Prepare face-connected repair utility
        shell: bash
        run: |
          set -euo pipefail
          cp ci/repair_stl_collection.py "$RUNNER_TEMP/repair_v6.py"
          python ci/patch_repair_dimension_retention.py "$RUNNER_TEMP/repair_v6.py"
          python ci/patch_repair_voxel_translation.py "$RUNNER_TEMP/repair_v6.py"
          python ci/patch_repair_face_connectivity.py "$RUNNER_TEMP/repair_v6.py"
          python -m py_compile \
            "$RUNNER_TEMP/repair_v6.py" \
            ci/validate_stl_collection.py \
            ci/compare_stl_silhouette.py

      - name: Repair every model in chunk
        id: repair_step
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/raw_${{ matrix.chunk }}"
          OUT="$RUNNER_TEMP/fixed_${{ matrix.chunk }}"
          REPORT="$OUT/Reports/Chunk_${{ matrix.chunk }}"
          mkdir -p "$OUT/STL" "$REPORT"
          python "$RUNNER_TEMP/repair_v6.py" \
            --input "$RAW/STL" \
            --output "$OUT/STL" \
            --report-json "$REPORT/repair_validation.json" \
            --report-csv "$REPORT/repair_validation.csv" \
            --expected "${{ matrix.expected }}" \
            --pitch 0.62 \
            --max-triangles 500000 \
            --target-triangles 440000 \
            --minimum-dimension-retention 0.90 \
            --maximum-dimension-retention 1.10 \
            2>&1 | tee "$REPORT/repair.log"

      - name: Independently validate closed one-body topology
        id: topology_step
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/fixed_${{ matrix.chunk }}"
          REPORT="$OUT/Reports/Chunk_${{ matrix.chunk }}"
          python ci/validate_stl_collection.py \
            --input "$OUT/STL" \
            --report-json "$REPORT/final_validation.json" \
            --report-csv "$REPORT/final_validation.csv" \
            --checksums "$REPORT/SHA256SUMS.txt" \
            --expected "${{ matrix.expected }}"

      - name: Check that no hero filename disappeared or changed
        id: names_step
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/raw_${{ matrix.chunk }}"
          OUT="$RUNNER_TEMP/fixed_${{ matrix.chunk }}"
          REPORT="$OUT/Reports/Chunk_${{ matrix.chunk }}"
          find "$OUT/STL" -maxdepth 1 -type f -name '*.stl' -printf '%f\n' \
            | sort > "$REPORT/repaired_file_list.txt"
          diff -u "$RAW/raw_file_list.txt" "$REPORT/repaired_file_list.txt" \
            | tee "$REPORT/filename_diff.txt"

      - name: Compare repaired silhouettes with source models
        id: silhouette_step
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/raw_${{ matrix.chunk }}"
          OUT="$RUNNER_TEMP/fixed_${{ matrix.chunk }}"
          REPORT="$OUT/Reports/Chunk_${{ matrix.chunk }}"
          python ci/compare_stl_silhouette.py \
            --raw "$RAW/STL" \
            --repaired "$OUT/STL" \
            --report-json "$REPORT/silhouette_validation.json" \
            --report-csv "$REPORT/silhouette_validation.csv" \
            --image "$REPORT/silhouette_contact_sheet.png" \
            --expected "${{ matrix.expected }}" \
            --pixel-mm 0.65 \
            --tolerance-mm 1.95 \
            --minimum-raw-coverage 0.985 \
            --minimum-repaired-coverage 0.970 \
            --minimum-iou 0.940 \
            --maximum-points 500000

      - name: Copy source diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/raw_${{ matrix.chunk }}"
          OUT="$RUNNER_TEMP/fixed_${{ matrix.chunk }}"
          REPORT="$OUT/Reports/Chunk_${{ matrix.chunk }}"
          mkdir -p "$REPORT/Raw_Source_Reports"
          if [[ -d "$RAW/Reports" ]]; then
            find "$RAW/Reports" -maxdepth 4 -type f \
              -exec cp {} "$REPORT/Raw_Source_Reports/" \;
          fi
          cp "$RAW/raw_file_list.txt" "$REPORT/raw_file_list.txt"
          printf '%s\n' "$RAW_BUILD_RUN_ID" > "$REPORT/raw_workflow_run_id.txt"

      - name: Upload repaired chunk and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOTS-v6-fixed-chunk-${{ matrix.chunk }}
          path: ${{ runner.temp }}/fixed_${{ matrix.chunk }}
          retention-days: 90
          compression-level: 0

      - name: Enforce every chunk quality gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.repair_step.outcome }}" == "success" ]]
          [[ "${{ steps.topology_step.outcome }}" == "success" ]]
          [[ "${{ steps.names_step.outcome }}" == "success" ]]
          [[ "${{ steps.silhouette_step.outcome }}" == "success" ]]

  package:
    needs: repair
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: HOTS-v6-fixed-chunk-*
          path: ${{ runner.temp }}/chunks
          merge-multiple: true

      - name: Assemble all 91 heroes
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/HOTS_All_91_Heroes_Printable_STL"
          mkdir -p "$PACKAGE/STL" "$PACKAGE/Reports/Chunk_Reports"
          find "$RUNNER_TEMP/chunks/STL" -maxdepth 1 -type f -name '*.stl' \
            -exec cp {} "$PACKAGE/STL/" \;
          cp -r "$RUNNER_TEMP/chunks/Reports/." "$PACKAGE/Reports/Chunk_Reports/"
          test "$(find "$PACKAGE/STL" -maxdepth 1 -type f -name '*.stl' | wc -l)" -eq 91
          find "$PACKAGE/STL" -maxdepth 1 -type f -name '*.stl' -printf '%f\n' \
            | sort > "$PACKAGE/Reports/STL_FILE_LIST.txt"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Verify exact Heroes of the Storm roster
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ steps.assemble.outputs.package }}/STL" <<'PY'
          from pathlib import Path
          import re, sys

          groups = [
              "Abathur|Alarak|Alexstrasza|Ana|Anduin|Anub'arak|Artanis|Arthas|Auriel|Azmodan|Blaze|Brightwing|The Butcher|Cassia|Chen",
              "Cho|Chromie|D.Va|Deathwing|Deckard|Dehaka|Diablo|E.T.C.|Falstad|Fenix|Gall|Garrosh|Gazlowe|Genji|Greymane",
              "Gul'dan|Hanzo|Hogger|Illidan|Imperius|Jaina|Johanna|Junkrat|Kael'thas|Kel'Thuzad|Kerrigan|Kharazim|Leoric|Li Li|Li-Ming",
              "Lt. Morales|Lucio|Lunara|Maiev|Mal'Ganis|Malfurion|Malthael|Medivh|Mei|Mephisto|Muradin|Murky|Nazeebo|Nova|Orphea",
              "Probius|Qhira|Ragnaros|Raynor|Rehgar|Rexxar|Samuro|Sgt. Hammer|Sonya|Stitches|Stukov|Sylvanas|Tassadar|The Lost Vikings|Thrall",
              "Tracer|Tychus|Tyrael|Tyrande|Uther|Valeera|Valla|Varian|Whitemane|Xal'atath|Xul|Yrel|Zagara|Zarya|Zeratul|Zul'jin",
          ]
          heroes = [hero for group in groups for hero in group.split('|')]
          if len(heroes) != 91 or len(set(heroes)) != 91:
              raise SystemExit(f"Internal roster error: {len(heroes)} entries")

          def safe_filename(name: str) -> str:
              value = re.sub(r"[^A-Za-z0-9._-]+", "_", name.strip())
              value = re.sub(r"_+", "_", value).strip("_.")
              return value + ".stl"

          expected = {safe_filename(hero) for hero in heroes}
          actual = {path.name for path in Path(sys.argv[1]).glob('*.stl')}
          missing = sorted(expected - actual)
          unexpected = sorted(actual - expected)
          if missing or unexpected:
              print("Missing:", missing)
              print("Unexpected:", unexpected)
              raise SystemExit(1)
          print("Exact roster verified: 91 of 91 hero filenames present.")
          PY

      - name: Install final validator
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            trimesh==4.8.3 numpy==2.2.6 scipy==1.15.3

      - name: Reopen and independently validate all final files
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.assemble.outputs.package }}"
          python ci/validate_stl_collection.py \
            --input "$PACKAGE/STL" \
            --report-json "$PACKAGE/Reports/FINAL_VALIDATION.json" \
            --report-csv "$PACKAGE/Reports/FINAL_VALIDATION.csv" \
            --checksums "$PACKAGE/Reports/STL_SHA256SUMS.txt" \
            --expected 91

      - name: Add package notes
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.assemble.outputs.package }}"
          cat > "$PACKAGE/README_FIRST.txt" <<'EOF'
          HEROES OF THE STORM — ALL 91 REPAIRED, PRINTABLE HERO STL FILES

          The STL folder contains one named STL for every roster entry in this build,
          including Xal'atath. D.Va contains the pilot and mech. The Lost Vikings model
          contains Baleog, Erik and Olaf. Cho and Gall have separate roster files based
          on their shared in-game body mesh.

          The conversion and repair process captures visible source geometry, removes
          rendering-only helpers, thickens thin sheets, closes hollow/open surfaces,
          joins disconnected pieces by face-connected voxel bridges, and embeds the
          geometry in a printable base. Dimensional and silhouette-retention gates are
          used to reject repairs that lose significant limbs, weapons, armour or other
          visible geometry.

          Every final STL was reopened after export and passed checks for watertightness,
          consistent winding, finite coordinates, positive volume, one connected body,
          triangle count, dimensions, unchanged filename and retained silhouette.
          Detailed CSV/JSON reports and SHA-256 hashes are included under Reports.

          STL is geometry-only and cannot retain textures, normal maps, transparency,
          emissive effects or animation. Inspect orientation and supports in your slicer
          before printing.

          Heroes of the Storm and its characters/assets are owned by Blizzard
          Entertainment. These files are intended for personal, non-commercial fan use.
          Do not sell or commercially redistribute them.
          EOF
          printf '%s\n' "$GITHUB_RUN_ID" > "$PACKAGE/Reports/final_workflow_run_id.txt"
          printf '%s\n' "$GITHUB_SHA" > "$PACKAGE/Reports/source_commit.txt"
          printf '%s\n' "$RAW_BUILD_RUN_ID" > "$PACKAGE/Reports/raw_workflow_run_id.txt"

      - name: Create downloadable ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full
          PACKAGE="${{ steps.assemble.outputs.package }}"
          ARCHIVE="$GITHUB_WORKSPACE/HOTS_All_91_Heroes_Printable_STL.zip"
          cd "$RUNNER_TEMP"
          7z a -tzip -mx=7 -mmt=on "$ARCHIVE" "$(basename "$PACKAGE")"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "checksum=$ARCHIVE.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: HOTS_All_91_Heroes_Printable_STL
          path: |
            ${{ steps.zip.outputs.archive }}
            ${{ steps.zip.outputs.checksum }}
          retention-days: 90
          compression-level: 0

      - name: Publish final release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.assemble.outputs.package }}"
          TAG="hots-all-91-stl-v6-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            "${{ steps.zip.outputs.archive }}" \
            "${{ steps.zip.outputs.checksum }}" \
            "$PACKAGE/Reports/FINAL_VALIDATION.json#FINAL_VALIDATION.json" \
            "$PACKAGE/Reports/FINAL_VALIDATION.csv#FINAL_VALIDATION.csv" \
            "$PACKAGE/Reports/STL_SHA256SUMS.txt#STL_SHA256SUMS.txt" \
            "$PACKAGE/Reports/STL_FILE_LIST.txt#STL_FILE_LIST.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HOTS — All 91 repaired printable hero STL files" \
            --notes "All 91 final STL files passed independent topology, one-body, dimensional, filename and silhouette-retention quality gates."
