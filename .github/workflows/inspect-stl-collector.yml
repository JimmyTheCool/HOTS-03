name: Inspect HOTS STL Collector

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt-stl-builder
    paths:
      - .github/workflows/inspect-stl-collector.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 0

      - name: Inspect collector reports and an Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="build_reports/collector_inventory/inspection"
          mkdir -p "$OUT/release" "$OUT/test_artifact"

          gh release download "hots-stls-created-so-far-37209372121" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "HOTS_STL_Files_Created_So_Far.zip" \
            --dir "$RUNNER_TEMP/release"
          unzip -q "$RUNNER_TEMP/release/HOTS_STL_Files_Created_So_Far.zip" -d "$RUNNER_TEMP/release/extracted"
          find "$RUNNER_TEMP/release/extracted" -type f -maxdepth 5 -print > "$OUT/release/file_list.txt"
          cp "$RUNNER_TEMP/release/extracted/HOTS_STL_Files_Created_So_Far/Reports/manifest.json" "$OUT/release/manifest.json"
          cp "$RUNNER_TEMP/release/extracted/HOTS_STL_Files_Created_So_Far/Reports/source_inventory.csv" "$OUT/release/source_inventory.csv"

          TEST_ID=11302825015
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$TEST_ID/zip" \
            > "$RUNNER_TEMP/test_artifact.zip"
          file "$RUNNER_TEMP/test_artifact.zip" > "$OUT/test_artifact/file_type.txt"
          stat -c '%s' "$RUNNER_TEMP/test_artifact.zip" > "$OUT/test_artifact/bytes.txt"
          unzip -l "$RUNNER_TEMP/test_artifact.zip" > "$OUT/test_artifact/archive_listing.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Add STL collector inspection [skip ci]"
          git pull --rebase origin chatgpt-stl-builder
          git push origin HEAD:chatgpt-stl-builder
