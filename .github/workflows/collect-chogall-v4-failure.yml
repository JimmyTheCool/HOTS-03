name: Collect Cho-Gall V4 Failure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-chogall-v4-failure.yml'

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture failed Cho-Gall job log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          gh run view 37368988256 --repo "$GITHUB_REPOSITORY" --job 111961058221 --log > diagnostics/chogall_v4_failure.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/chogall_v4_failure.log
          git commit -m 'Add Cho-Gall V4 failure log [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
