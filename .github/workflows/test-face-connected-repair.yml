name: Test Face-Connected STL Repair

on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths: [.github/workflows/test-face-connected-repair.yml]

permissions:
  actions: read
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 0

      - name: Download raw difficult models
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chunk2" "$RUNNER_TEMP/chunk4" "$RUNNER_TEMP/chunk6"
          mkdir -p "$RUNNER_TEMP/raw"
          gh run download 37193141976 --repo "$GITHUB_REPOSITORY" --name HOTS-v3-chunk-2 --dir "$RUNNER_TEMP/chunk2"
          gh run download 37193141976 --repo "$GITHUB_REPOSITORY" --name HOTS-v3-chunk-4 --dir "$RUNNER_TEMP/chunk4"
          gh run download 37193141976 --repo "$GITHUB_REPOSITORY" --name HOTS-v3-chunk-6 --dir "$RUNNER_TEMP/chunk6"
          cp "$RUNNER_TEMP/chunk2/STL/D.Va.stl" "$RUNNER_TEMP/raw/"
          cp "$RUNNER_TEMP/chunk4/STL/Lunara.stl" "$RUNNER_TEMP/raw/"
          cp "$RUNNER_TEMP/chunk4/STL/Nazeebo.stl" "$RUNNER_TEMP/raw/"
          cp "$RUNNER_TEMP/chunk6/STL/Tychus.stl" "$RUNNER_TEMP/raw/"

      - name: Install repair dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            trimesh==4.8.3 numpy==2.2.6 scipy==1.15.3 \
            scikit-image==0.25.2 pymeshfix==0.18.1 \
            fast-simplification==0.1.12 matplotlib==3.10.1

      - name: Prepare corrected repair utility
        shell: bash
        run: |
          set -euo pipefail
          cp ci/repair_stl_collection.py "$RUNNER_TEMP/repair_face_connected.py"
          python ci/patch_repair_dimension_retention.py "$RUNNER_TEMP/repair_face_connected.py"
          python ci/patch_repair_voxel_translation.py "$RUNNER_TEMP/repair_face_connected.py"
          python ci/patch_repair_face_connectivity.py "$RUNNER_TEMP/repair_face_connected.py"
          python -m py_compile "$RUNNER_TEMP/repair_face_connected.py"

      - name: Repair difficult models
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT/STL" "$OUT/Reports"
          python "$RUNNER_TEMP/repair_face_connected.py" \
            --input "$RUNNER_TEMP/raw" \
            --output "$OUT/STL" \
            --report-json "$OUT/Reports/repair_validation.json" \
            --report-csv "$OUT/Reports/repair_validation.csv" \
            --expected 4 \
            --pitch 0.62 \
            --max-triangles 500000 \
            --target-triangles 440000 \
            --minimum-dimension-retention 0.90 \
            --maximum-dimension-retention 1.10 \
            2>&1 | tee "$OUT/Reports/repair.log"

      - name: Independently validate topology
        id: topology
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          python ci/validate_stl_collection.py \
            --input "$OUT/STL" \
            --report-json "$OUT/Reports/final_validation.json" \
            --report-csv "$OUT/Reports/final_validation.csv" \
            --checksums "$OUT/Reports/SHA256SUMS.txt" \
            --expected 4

      - name: Validate silhouettes
        id: silhouette
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          python ci/compare_stl_silhouette.py \
            --raw "$RUNNER_TEMP/raw" \
            --repaired "$OUT/STL" \
            --report-json "$OUT/Reports/silhouette_validation.json" \
            --report-csv "$OUT/Reports/silhouette_validation.csv" \
            --image "$OUT/Reports/silhouette_contact_sheet.png" \
            --expected 4 \
            --pixel-mm 0.65 \
            --tolerance-mm 1.95 \
            --minimum-raw-coverage 0.985 \
            --minimum-repaired-coverage 0.970 \
            --minimum-iou 0.940 \
            --maximum-points 500000

      - name: Publish diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEST=build_reports/face_connected_repair_test
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP/out/Reports/"* "$DEST/" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Add face-connected repair test reports [skip ci]"
            git pull --rebase origin chatgpt-stl-builder
            git push origin HEAD:chatgpt-stl-builder
          fi

      - name: Upload repaired samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOTS-face-connected-repair-test
          path: ${{ runner.temp }}/out
          retention-days: 30
          compression-level: 0

      - name: Enforce all quality gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.repair.outcome }}" == "success" ]]
          [[ "${{ steps.topology.outcome }}" == "success" ]]
          [[ "${{ steps.silhouette.outcome }}" == "success" ]]
