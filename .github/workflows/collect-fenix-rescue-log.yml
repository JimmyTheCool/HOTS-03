name: Collect Fenix Rescue Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths: [.github/workflows/collect-fenix-rescue-log.yml]

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 0
      - name: Save Fenix failed-job log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEST=build_reports/fenix_rescue_failure
          mkdir -p "$DEST"
          gh run view 37199448751 \
            --repo "$GITHUB_REPOSITORY" \
            --job 111427935041 \
            --log > "$DEST/job.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST/job.log"
          git commit -m "Add Fenix rescue diagnostics [skip ci]"
          git pull --rebase origin chatgpt-stl-builder
          git push origin HEAD:chatgpt-stl-builder
