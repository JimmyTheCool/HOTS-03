name: Extract Fenix Adaptive Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths: [.github/workflows/extract-fenix-adaptive-step.yml]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 0
      - name: Extract only adaptive repair lines
        shell: bash
        run: |
          set -euo pipefail
          SRC=build_reports/fenix_rescue_failure/job.log
          DEST=build_reports/fenix_rescue_failure/adaptive_step.txt
          test -f "$SRC"
          awk -F '\t' '$2 == "Repair one hero adaptively" {print $3}' "$SRC" \
            | tail -n 160 > "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Extract Fenix adaptive repair step [skip ci]"
          git pull --rebase origin chatgpt-stl-builder
          git push origin HEAD:chatgpt-stl-builder
