name: Summarise HOTS v8 Main Run

on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths: [.github/workflows/summarise-v8-main-run.yml]

permissions:
  actions: read
  contents: write

jobs:
  summarise:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 0
      - name: Save job and artifact summary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEST=build_reports/v8_main_summary
          mkdir -p "$DEST"
          gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/actions/runs/37199157100/jobs?per_page=100" \
            --jq '.jobs[] | [.name,.status,(.conclusion // "")] | @tsv' \
            | sort -V > "$DEST/jobs.tsv"
          gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/actions/runs/37199157100/artifacts?per_page=100" \
            --jq '.artifacts[] | [.name,.size_in_bytes,.expired] | @tsv' \
            | sort -V > "$DEST/artifacts.tsv"
          gh run view 37199157100 --repo "$GITHUB_REPOSITORY" --json status,conclusion,url > "$DEST/run.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Add HOTS v8 main-run summary [skip ci]"
          git pull --rebase origin chatgpt-stl-builder
          git push origin HEAD:chatgpt-stl-builder
