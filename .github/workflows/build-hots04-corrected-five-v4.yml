name: Build HOTS-04 Corrected Five V4

on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths:
      - '.github/workflows/build-hots04-corrected-five-v4.yml'

permissions:
  contents: write
  actions: read

env:
  BLENDER_VERSION: 3.6.23
  M3ADDON_COMMIT: 58935005c4465a219a740f6b740253533eda773f

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {hero: 'Cho-Gall', safe: 'Cho-Gall', voxel: '0.220'}
          - {hero: 'Nova', safe: 'Nova', voxel: '0.200'}
          - {hero: 'Rexxar', safe: 'Rexxar', voxel: '0.240'}
          - {hero: 'Lt Morales', safe: 'Lt_Morales', voxel: '0.220'}
          - {hero: 'Dehaka', safe: 'Dehaka', voxel: '0.260'}

    steps:
      - name: Check out HOTS-04 corrected photo-pose branch
        uses: actions/checkout@v4
        with:
          repository: JimmyTheCool/HOTS-04
          ref: photo-pose-v4
          fetch-depth: 1

      - name: Apply explicit skin corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('reference_analysis/selected_skin_plan.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          heroes = data['heroes']
          heroes['Rexxar'].update({
              'skin_key': 'base',
              'directory': 'storm_hero_rexxar_base',
              'repository': 'HOTS-03',
              'model_path': 'storm_hero_rexxar_base/storm_hero_rexxar_base.m3',
              'selection_method': 'user correction: base Rexxar geometry',
          })
          heroes['Lt Morales'].update({
              'skin_key': 'apoth',
              'directory': 'storm_hero_medic_apoth',
              'repository': 'HOTS-03',
              'model_path': 'storm_hero_medic_apoth/storm_hero_medic_apoth.m3',
              'selection_method': 'user correction: Apothecary Lt. Morales geometry',
          })
          heroes['Dehaka'].update({
              'skin_key': 'mecha',
              'directory': 'storm_hero_dehaka_mecha',
              'repository': 'HOTS-02',
              'model_path': 'storm_hero_dehaka_mecha/storm_hero_dehaka_mecha.m3',
              'selection_method': 'user correction: Mecha Dehaka geometry',
          })
          path.write_text(json.dumps(data, indent=2), encoding='utf-8')
          print(json.dumps({k: heroes[k] for k in ('Rexxar','Lt Morales','Dehaka')}, indent=2))
          PY

      - name: Prepare audited V4 runner
        shell: bash
        run: |
          set -euo pipefail
          python tools/prepare_photo_pose_v4.py \
            --runner-bootstrap tools/run_photo_posed_job_v3_2.py \
            --pose-source tools/exposed_r2/build_one_photo_posed_v3_source.py \
            --output-runner tools/run_photo_posed_job_v4.py \
            --output-pose tools/build_one_photo_posed_v4.py \
            --voxel '${{ matrix.voxel }}' \
            --max-triangles 900000 \
            --target-triangles 820000
          python -m py_compile tools/run_photo_posed_job_v4.py tools/build_one_photo_posed_v4.py

      - name: Build exact skin in matched standing pose
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_photo_posed_job_v4.py \
            --hero '${{ matrix.hero }}' \
            --max-animations 30 \
            --max-coarse-frames 192 \
            --refine-candidates 12

      - name: Produce smooth one-body print STL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np
          import trimesh

          root = Path(os.environ['HERO_ARTIFACT_ROOT'])
          safe = os.environ['HERO_SAFE']
          hero = '${{ matrix.hero }}'
          candidates = [root/'HighDetail'/f'{safe}.stl', root/'Robust'/f'{safe}.stl']
          source = None
          for candidate in candidates:
              if not candidate.is_file():
                  continue
              mesh = trimesh.load_mesh(candidate, force='mesh', process=True)
              if isinstance(mesh, trimesh.Scene):
                  mesh = trimesh.util.concatenate(tuple(mesh.geometry.values()))
              if mesh.is_watertight and int(mesh.body_count) == 1:
                  source = candidate
                  break
          if source is None:
              raise SystemExit(f'No validated one-body source for {hero}')
          mesh = trimesh.load_mesh(source, force='mesh', process=True)
          if isinstance(mesh, trimesh.Scene):
              mesh = trimesh.util.concatenate(tuple(mesh.geometry.values()))
          before_volume = float(abs(mesh.volume))
          before = mesh.vertices.copy()
          base_limit = float(mesh.bounds[0,2] + 1.2)
          base = np.flatnonzero(before[:,2] <= base_limit)
          trimesh.smoothing.filter_taubin(mesh, lamb=0.30, nu=0.31, iterations=5)
          if len(base):
              mesh.vertices[base,2] = before[base,2]
          mesh.apply_translation((0.0,0.0,-float(mesh.bounds[0,2])))
          try:
              trimesh.repair.fix_normals(mesh, multibody=True)
          except TypeError:
              trimesh.repair.fix_normals(mesh)
          mesh.remove_unreferenced_vertices()
          out = root/'Smooth'; out.mkdir(parents=True, exist_ok=True)
          target = out/f'{safe}.stl'; mesh.export(target)
          check = trimesh.load_mesh(target, force='mesh', process=True)
          if isinstance(check, trimesh.Scene):
              check = trimesh.util.concatenate(tuple(check.geometry.values()))
          report = {
              'hero': hero,
              'source': str(source),
              'output': str(target),
              'vertices': int(len(check.vertices)),
              'triangles': int(len(check.faces)),
              'watertight': bool(check.is_watertight),
              'winding_consistent': bool(check.is_winding_consistent),
              'connected_bodies': int(check.body_count),
              'finite': bool(np.isfinite(check.vertices).all()),
              'volume_mm3': float(abs(check.volume)),
              'volume_retention': float(abs(check.volume)/max(before_volume,1e-9)),
              'extents_mm': [float(v) for v in check.extents],
          }
          report['passed'] = bool(
              report['watertight'] and report['winding_consistent']
              and report['connected_bodies']==1 and report['finite']
              and report['volume_mm3']>1 and 100<=report['triangles']<=900000
              and 0.90<=report['volume_retention']<=1.10
          )
          reports = root/'Reports'/safe; reports.mkdir(parents=True, exist_ok=True)
          (reports/'smooth_validation.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          if not report['passed']:
              raise SystemExit('Smoothed model failed validation')
          PY

      - name: Upload corrected hero output
        uses: actions/upload-artifact@v4
        with:
          name: corrected-v4-${{ matrix.safe }}
          path: ${{ env.HERO_ARTIFACT_ROOT }}
          retention-days: 90
          compression-level: 0

  package:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Download corrected heroes
        uses: actions/download-artifact@v4
        with:
          pattern: corrected-v4-*
          path: ${{ runner.temp }}/heroes

      - name: Validate and package corrected five
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet trimesh==4.8.3 numpy==2.2.6
          ROOT="$RUNNER_TEMP/HOTS04_Corrected_Five_Photo_Posed_Smooth_V4"
          mkdir -p "$ROOT/01_Smooth_Print_Ready" "$ROOT/02_Robust_Fallback" "$ROOT/03_Pose_Proofs" "$ROOT/Reports"
          find "$RUNNER_TEMP/heroes" -path '*/Smooth/*.stl' -exec cp {} "$ROOT/01_Smooth_Print_Ready/" \;
          find "$RUNNER_TEMP/heroes" -path '*/Robust/*.stl' -exec cp {} "$ROOT/02_Robust_Fallback/" \;
          find "$RUNNER_TEMP/heroes" -iname '*pose_proof*.jpg' -exec cp {} "$ROOT/03_Pose_Proofs/" \;
          cp -R "$RUNNER_TEMP/heroes" "$ROOT/Reports/Per_Hero"
          python - "$ROOT" <<'PY'
          from pathlib import Path
          import hashlib,json,sys,numpy as np,trimesh
          root=Path(sys.argv[1]); folder=root/'01_Smooth_Print_Ready'
          expected={'Cho-Gall.stl','Nova.stl','Rexxar.stl','Lt_Morales.stl','Dehaka.stl'}
          rows=[]; failures=[]
          for path in sorted(folder.glob('*.stl')):
              mesh=trimesh.load_mesh(path,force='mesh',process=True)
              if isinstance(mesh,trimesh.Scene): mesh=trimesh.util.concatenate(tuple(mesh.geometry.values()))
              row={'file':path.name,'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'triangles':int(len(mesh.faces)),'watertight':bool(mesh.is_watertight),'winding':bool(mesh.is_winding_consistent),'bodies':int(mesh.body_count),'finite':bool(np.isfinite(mesh.vertices).all()),'volume':float(abs(mesh.volume)),'extents':[float(v) for v in mesh.extents]}
              row['passed']=bool(row['watertight'] and row['winding'] and row['bodies']==1 and row['finite'] and row['volume']>1 and 100<=row['triangles']<=900000)
              rows.append(row)
              if not row['passed']: failures.append(row)
          found={p.name for p in folder.glob('*.stl')}
          summaries={}
          for path in root.rglob('photo_pose_quality_summary.json'):
              try:
                  data=json.loads(path.read_text()); summaries[data['hero']]=data
              except Exception: pass
          pose_fail=[]
          forbidden=('sit','seat','chair','throne','crouch','kneel','crawl')
          for hero in ('Nova','Cho-Gall'):
              anim=str(summaries.get(hero,{}).get('selected_animation','')).casefold()
              if not anim or any(t in anim for t in forbidden): pose_fail.append({'hero':hero,'animation':anim})
          ground=[]
          for path in root.rglob('photo_posed_build.json'):
              try: data=json.loads(path.read_text())
              except Exception: continue
              if data.get('hero')=='Cho-Gall':
                  item=data.get('builder_result',{}).get('normalization',{}).get('two_foot_grounding')
                  if item: ground.append(item)
          ground_ok=any(g.get('applied') and float(g.get('foot_height_gap_mm',999))<=1.25 for g in ground)
          report={'expected':sorted(expected),'found':sorted(found),'files':rows,'geometry_failures':failures,'pose_failures':pose_fail,'cho_gall_grounding':ground,'passed':found==expected and not failures and not pose_fail and ground_ok,'pose_summaries':summaries}
          (root/'Reports'/'FINAL_VALIDATION.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if not report['passed']: raise SystemExit('Corrected-five quality gate failed')
          PY
          cat > "$ROOT/README_FIRST.txt" <<'EOF'
          Five corrected HOTS-04 models:
          - Ultimate Cho-Gall in a standing pose, with bilateral foot contact aligned to the base.
          - Nova restricted to standing/idle animation frames.
          - Rexxar rebuilt with base skin geometry.
          - Lt. Morales rebuilt with Apothecary skin geometry.
          - Dehaka rebuilt with Mecha skin geometry.

          Use 01_Smooth_Print_Ready for slicing. Robust fallbacks and pose evidence are included.
          EOF
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends p7zip-full
          ZIP="$GITHUB_WORKSPACE/HOTS04_Corrected_Five_Photo_Posed_Smooth_V4.zip"
          cd "$RUNNER_TEMP" && 7z a -tzip -mx=7 "$ZIP" "$(basename "$ROOT")"
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "tag=hots04-corrected-five-v4-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload corrected-five ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HOTS04_Corrected_Five_Photo_Posed_Smooth_V4
          path: |
            HOTS04_Corrected_Five_Photo_Posed_Smooth_V4.zip
            HOTS04_Corrected_Five_Photo_Posed_Smooth_V4.zip.sha256
          retention-days: 90
          compression-level: 0

      - name: Publish corrected-five release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create '${{ steps.zip.outputs.tag }}' \
            '${{ steps.zip.outputs.zip }}' \
            '${{ steps.zip.outputs.zip }}.sha256' \
            "$RUNNER_TEMP/HOTS04_Corrected_Five_Photo_Posed_Smooth_V4/Reports/FINAL_VALIDATION.json#FINAL_VALIDATION.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'HOTS-04 corrected five photo-posed smooth STLs V4' \
            --notes 'Corrected Ultimate Cho-Gall grounding, standing Nova, base Rexxar, Apothecary Lt. Morales, and Mecha Dehaka. All delivered STLs are smooth, watertight, finite, positive-volume, one connected body, and independently validated.'
