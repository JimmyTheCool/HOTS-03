name: Record Recovered STL Manifest

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt-stl-builder
    paths:
      - .github/workflows/record-r4-manifest.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 0

      - name: Download and commit manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="build_reports/collector_r4"
          mkdir -p "$OUT"
          gh release download "hots-stls-created-so-far-r4-37209869641" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "manifest.json" \
            --pattern "manifest.csv" \
            --dir "$OUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Add recovered STL package manifest [skip ci]"
          git pull --rebase origin chatgpt-stl-builder
          git push origin HEAD:chatgpt-stl-builder
