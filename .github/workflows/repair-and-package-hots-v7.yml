name: Repair and Package HOTS STL v7

on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths: [.github/workflows/repair-and-package-hots-v7.yml]

permissions:
  actions: read
  contents: write

env:
  RAW_BUILD_RUN_ID: 37193141976

jobs:
  repair_group:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {group: 1, chunk: 1, expected: 3, files: "Abathur.stl|Alarak.stl|Alexstrasza.stl"}
          - {group: 2, chunk: 1, expected: 3, files: "Ana.stl|Anduin.stl|Anub_arak.stl"}
          - {group: 3, chunk: 1, expected: 3, files: "Artanis.stl|Arthas.stl|Auriel.stl"}
          - {group: 4, chunk: 1, expected: 3, files: "Azmodan.stl|Blaze.stl|Brightwing.stl"}
          - {group: 5, chunk: 1, expected: 3, files: "The_Butcher.stl|Cassia.stl|Chen.stl"}
          - {group: 6, chunk: 2, expected: 3, files: "Cho.stl|Chromie.stl|D.Va.stl"}
          - {group: 7, chunk: 2, expected: 3, files: "Deathwing.stl|Deckard.stl|Dehaka.stl"}
          - {group: 8, chunk: 2, expected: 3, files: "Diablo.stl|E.T.C.stl|Falstad.stl"}
          - {group: 9, chunk: 2, expected: 3, files: "Fenix.stl|Gall.stl|Garrosh.stl"}
          - {group: 10, chunk: 2, expected: 3, files: "Gazlowe.stl|Genji.stl|Greymane.stl"}
          - {group: 11, chunk: 3, expected: 3, files: "Gul_dan.stl|Hanzo.stl|Hogger.stl"}
          - {group: 12, chunk: 3, expected: 3, files: "Illidan.stl|Imperius.stl|Jaina.stl"}
          - {group: 13, chunk: 3, expected: 3, files: "Johanna.stl|Junkrat.stl|Kael_thas.stl"}
          - {group: 14, chunk: 3, expected: 3, files: "Kel_Thuzad.stl|Kerrigan.stl|Kharazim.stl"}
          - {group: 15, chunk: 3, expected: 3, files: "Leoric.stl|Li_Li.stl|Li-Ming.stl"}
          - {group: 16, chunk: 4, expected: 3, files: "Lt._Morales.stl|Lucio.stl|Lunara.stl"}
          - {group: 17, chunk: 4, expected: 3, files: "Maiev.stl|Mal_Ganis.stl|Malfurion.stl"}
          - {group: 18, chunk: 4, expected: 3, files: "Malthael.stl|Medivh.stl|Mei.stl"}
          - {group: 19, chunk: 4, expected: 3, files: "Mephisto.stl|Muradin.stl|Murky.stl"}
          - {group: 20, chunk: 4, expected: 3, files: "Nazeebo.stl|Nova.stl|Orphea.stl"}
          - {group: 21, chunk: 5, expected: 3, files: "Probius.stl|Qhira.stl|Ragnaros.stl"}
          - {group: 22, chunk: 5, expected: 3, files: "Raynor.stl|Rehgar.stl|Rexxar.stl"}
          - {group: 23, chunk: 5, expected: 3, files: "Samuro.stl|Sgt._Hammer.stl|Sonya.stl"}
          - {group: 24, chunk: 5, expected: 3, files: "Stitches.stl|Stukov.stl|Sylvanas.stl"}
          - {group: 25, chunk: 5, expected: 3, files: "Tassadar.stl|The_Lost_Vikings.stl|Thrall.stl"}
          - {group: 26, chunk: 6, expected: 3, files: "Tracer.stl|Tychus.stl|Tyrael.stl"}
          - {group: 27, chunk: 6, expected: 3, files: "Tyrande.stl|Uther.stl|Valeera.stl"}
          - {group: 28, chunk: 6, expected: 3, files: "Valla.stl|Varian.stl|Whitemane.stl"}
          - {group: 29, chunk: 6, expected: 3, files: "Xal_atath.stl|Xul.stl|Yrel.stl"}
          - {group: 30, chunk: 6, expected: 3, files: "Zagara.stl|Zarya.stl|Zeratul.stl"}
          - {group: 31, chunk: 6, expected: 1, files: "Zul_jin.stl"}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 1

      - name: Download raw source chunk and select group
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/raw_chunk"
          SELECTED="$RUNNER_TEMP/raw_selected"
          mkdir -p "$RAW" "$SELECTED"
          gh run download "$RAW_BUILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "HOTS-v3-chunk-${{ matrix.chunk }}" \
            --dir "$RAW"
          IFS='|' read -ra FILES <<< '${{ matrix.files }}'
          for filename in "${FILES[@]}"; do
            test -f "$RAW/STL/$filename"
            cp "$RAW/STL/$filename" "$SELECTED/$filename"
          done
          test "$(find "$SELECTED" -maxdepth 1 -type f -name '*.stl' | wc -l)" \
            -eq "${{ matrix.expected }}"
          find "$SELECTED" -maxdepth 1 -type f -name '*.stl' -printf '%f\n' \
            | sort > "$RUNNER_TEMP/raw_file_list.txt"

      - name: Install repair and validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            trimesh==4.8.3 numpy==2.2.6 scipy==1.15.3 \
            scikit-image==0.25.2 pymeshfix==0.18.1 \
            fast-simplification==0.1.12 matplotlib==3.10.1

      - name: Prepare face-connected repair utility
        shell: bash
        run: |
          set -euo pipefail
          cp ci/repair_stl_collection.py "$RUNNER_TEMP/repair_v7.py"
          python ci/patch_repair_dimension_retention.py "$RUNNER_TEMP/repair_v7.py"
          python ci/patch_repair_voxel_translation.py "$RUNNER_TEMP/repair_v7.py"
          python ci/patch_repair_face_connectivity.py "$RUNNER_TEMP/repair_v7.py"
          python -m py_compile \
            "$RUNNER_TEMP/repair_v7.py" \
            ci/validate_stl_collection.py \
            ci/compare_stl_silhouette.py

      - name: Repair selected hero models
        id: repair_step
        shell: bash
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/fixed"
          REPORT="$OUT/Reports/Group_${{ matrix.group }}"
          mkdir -p "$OUT/STL" "$REPORT"
          set +e
          python "$RUNNER_TEMP/repair_v7.py" \
            --input "$RUNNER_TEMP/raw_selected" \
            --output "$OUT/STL" \
            --report-json "$REPORT/repair_validation.json" \
            --report-csv "$REPORT/repair_validation.csv" \
            --expected "${{ matrix.expected }}" \
            --pitch 0.62 \
            --max-triangles 500000 \
            --target-triangles 440000 \
            --minimum-dimension-retention 0.90 \
            --maximum-dimension-retention 1.10 \
            2>&1 | tee "$REPORT/repair.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$STATUS" > "$REPORT/repair_exit_code.txt"
          echo "repair_exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Independently validate topology and dimensions
        id: topology_step
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/fixed"
          REPORT="$OUT/Reports/Group_${{ matrix.group }}"
          python ci/validate_stl_collection.py \
            --input "$OUT/STL" \
            --report-json "$REPORT/final_validation.json" \
            --report-csv "$REPORT/final_validation.csv" \
            --checksums "$REPORT/SHA256SUMS.txt" \
            --expected "${{ matrix.expected }}"

      - name: Verify unchanged filenames
        id: names_step
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/fixed"
          REPORT="$OUT/Reports/Group_${{ matrix.group }}"
          find "$OUT/STL" -maxdepth 1 -type f -name '*.stl' -printf '%f\n' \
            | sort > "$REPORT/repaired_file_list.txt"
          diff -u "$RUNNER_TEMP/raw_file_list.txt" "$REPORT/repaired_file_list.txt" \
            | tee "$REPORT/filename_diff.txt"
          cp "$RUNNER_TEMP/raw_file_list.txt" "$REPORT/raw_file_list.txt"

      - name: Validate silhouette retention
        id: silhouette_step
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/fixed"
          REPORT="$OUT/Reports/Group_${{ matrix.group }}"
          python ci/compare_stl_silhouette.py \
            --raw "$RUNNER_TEMP/raw_selected" \
            --repaired "$OUT/STL" \
            --report-json "$REPORT/silhouette_validation.json" \
            --report-csv "$REPORT/silhouette_validation.csv" \
            --image "$REPORT/silhouette_contact_sheet.png" \
            --expected "${{ matrix.expected }}" \
            --pixel-mm 0.65 \
            --tolerance-mm 1.95 \
            --minimum-raw-coverage 0.985 \
            --minimum-repaired-coverage 0.970 \
            --minimum-iou 0.940 \
            --maximum-points 500000
          printf '%s\n' "$RAW_BUILD_RUN_ID" > "$REPORT/raw_workflow_run_id.txt"

      - name: Upload repaired group
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOTS-v7-group-${{ matrix.group }}
          path: ${{ runner.temp }}/fixed
          retention-days: 90
          compression-level: 0

      - name: Enforce independent quality gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.topology_step.outcome }}" == "success" ]]
          [[ "${{ steps.names_step.outcome }}" == "success" ]]
          [[ "${{ steps.silhouette_step.outcome }}" == "success" ]]

  package:
    needs: repair_group
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: HOTS-v7-group-*
          path: ${{ runner.temp }}/groups
          merge-multiple: true

      - name: Assemble all hero STL files
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/HOTS_All_91_Heroes_Printable_STL"
          mkdir -p "$PACKAGE/STL" "$PACKAGE/Reports/Group_Reports"
          find "$RUNNER_TEMP/groups/STL" -maxdepth 1 -type f -name '*.stl' \
            -exec cp {} "$PACKAGE/STL/" \;
          cp -r "$RUNNER_TEMP/groups/Reports/." "$PACKAGE/Reports/Group_Reports/"
          test "$(find "$PACKAGE/STL" -maxdepth 1 -type f -name '*.stl' | wc -l)" -eq 91
          find "$PACKAGE/STL" -maxdepth 1 -type f -name '*.stl' -printf '%f\n' \
            | sort > "$PACKAGE/Reports/STL_FILE_LIST.txt"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Verify exact 91-file roster
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ steps.assemble.outputs.package }}/STL" <<'PY'
          from pathlib import Path
          import re, sys
          groups = [
              "Abathur|Alarak|Alexstrasza|Ana|Anduin|Anub'arak|Artanis|Arthas|Auriel|Azmodan|Blaze|Brightwing|The Butcher|Cassia|Chen",
              "Cho|Chromie|D.Va|Deathwing|Deckard|Dehaka|Diablo|E.T.C.|Falstad|Fenix|Gall|Garrosh|Gazlowe|Genji|Greymane",
              "Gul'dan|Hanzo|Hogger|Illidan|Imperius|Jaina|Johanna|Junkrat|Kael'thas|Kel'Thuzad|Kerrigan|Kharazim|Leoric|Li Li|Li-Ming",
              "Lt. Morales|Lucio|Lunara|Maiev|Mal'Ganis|Malfurion|Malthael|Medivh|Mei|Mephisto|Muradin|Murky|Nazeebo|Nova|Orphea",
              "Probius|Qhira|Ragnaros|Raynor|Rehgar|Rexxar|Samuro|Sgt. Hammer|Sonya|Stitches|Stukov|Sylvanas|Tassadar|The Lost Vikings|Thrall",
              "Tracer|Tychus|Tyrael|Tyrande|Uther|Valeera|Valla|Varian|Whitemane|Xal'atath|Xul|Yrel|Zagara|Zarya|Zeratul|Zul'jin",
          ]
          heroes = [hero for group in groups for hero in group.split('|')]
          def filename(name):
              value = re.sub(r"[^A-Za-z0-9._-]+", "_", name.strip())
              value = re.sub(r"_+", "_", value).strip("_.")
              return value + ".stl"
          expected = {filename(hero) for hero in heroes}
          actual = {path.name for path in Path(sys.argv[1]).glob('*.stl')}
          if len(heroes) != 91 or len(expected) != 91 or actual != expected:
              print("Missing:", sorted(expected - actual))
              print("Unexpected:", sorted(actual - expected))
              raise SystemExit(1)
          print("Exact roster verified: 91 of 91 named hero STL files.")
          PY

      - name: Install final validator
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            trimesh==4.8.3 numpy==2.2.6 scipy==1.15.3

      - name: Reopen and validate all 91 packaged files
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.assemble.outputs.package }}"
          python ci/validate_stl_collection.py \
            --input "$PACKAGE/STL" \
            --report-json "$PACKAGE/Reports/FINAL_VALIDATION.json" \
            --report-csv "$PACKAGE/Reports/FINAL_VALIDATION.csv" \
            --checksums "$PACKAGE/Reports/STL_SHA256SUMS.txt" \
            --expected 91

      - name: Add package documentation
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.assemble.outputs.package }}"
          cat > "$PACKAGE/README_FIRST.txt" <<'EOF'
          HEROES OF THE STORM — ALL 91 REPAIRED PRINTABLE HERO STL FILES

          This package contains one named STL for each roster entry in this build,
          including Xal'atath. D.Va includes pilot and mech. The Lost Vikings contains
          Baleog, Erik and Olaf. Cho and Gall have separate roster files based on their
          shared in-game body mesh.

          Each file was repaired in a small isolated group to avoid memory-related model
          loss. The process closes hollow surfaces, joins disconnected visible parts by
          face-connected voxel bridges, retains original dimensions and silhouette, and
          adds a printable base. It rejects missing files, renamed files, multiple bodies,
          non-watertight meshes, invalid coordinates, implausible dimensions and excessive
          silhouette loss.

          Every final file was reopened after packaging and passed independent topology
          validation. Detailed JSON/CSV reports and SHA-256 hashes are under Reports.

          STL stores geometry only; textures, transparent effects, emissive materials,
          normal maps and animation cannot be retained. Inspect orientation and supports
          in your slicer before printing.

          Heroes of the Storm and its characters/assets are owned by Blizzard
          Entertainment. These derivative files are intended for personal,
          non-commercial fan use. Do not sell or commercially redistribute them.
          EOF
          printf '%s\n' "$GITHUB_RUN_ID" > "$PACKAGE/Reports/final_workflow_run_id.txt"
          printf '%s\n' "$GITHUB_SHA" > "$PACKAGE/Reports/source_commit.txt"
          printf '%s\n' "$RAW_BUILD_RUN_ID" > "$PACKAGE/Reports/raw_workflow_run_id.txt"

      - name: Create final ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full
          PACKAGE="${{ steps.assemble.outputs.package }}"
          ARCHIVE="$GITHUB_WORKSPACE/HOTS_All_91_Heroes_Printable_STL.zip"
          cd "$RUNNER_TEMP"
          7z a -tzip -mx=7 -mmt=on "$ARCHIVE" "$(basename "$PACKAGE")"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "checksum=$ARCHIVE.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: HOTS_All_91_Heroes_Printable_STL
          path: |
            ${{ steps.zip.outputs.archive }}
            ${{ steps.zip.outputs.checksum }}
          retention-days: 90
          compression-level: 0

      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.assemble.outputs.package }}"
          TAG="hots-all-91-stl-v7-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            "${{ steps.zip.outputs.archive }}" \
            "${{ steps.zip.outputs.checksum }}" \
            "$PACKAGE/Reports/FINAL_VALIDATION.json#FINAL_VALIDATION.json" \
            "$PACKAGE/Reports/FINAL_VALIDATION.csv#FINAL_VALIDATION.csv" \
            "$PACKAGE/Reports/STL_SHA256SUMS.txt#STL_SHA256SUMS.txt" \
            "$PACKAGE/Reports/STL_FILE_LIST.txt#STL_FILE_LIST.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HOTS — All 91 repaired printable hero STL files" \
            --notes "All 91 files passed independent topology, exact-roster, one-body, dimensional and silhouette-retention gates."
