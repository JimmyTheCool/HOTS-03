name: Collect Full R2 Job Logs
on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths: [.github/workflows/collect-full-r2-job-logs.yml]
permissions:
  actions: read
  contents: write
jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 0
      - name: Collect individual matrix job logs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          D=build_reports/debug_logs/full_r2_jobs
          mkdir -p "$D"
          gh run view 37192482532 --repo "$GITHUB_REPOSITORY" --job 111407410515 --log > "$D/chunk1.log" || true
          gh run view 37192482532 --repo "$GITHUB_REPOSITORY" --job 111407410638 --log > "$D/chunk2.log" || true
          gh run view 37192482532 --repo "$GITHUB_REPOSITORY" --job 111407410578 --log > "$D/chunk3.log" || true
          gh run view 37192482532 --repo "$GITHUB_REPOSITORY" --job 111407410508 --log > "$D/chunk4.log" || true
          gh run view 37192482532 --repo "$GITHUB_REPOSITORY" --job 111407410542 --log > "$D/chunk5.log" || true
          gh run view 37192482532 --repo "$GITHUB_REPOSITORY" --job 111407410405 --log > "$D/chunk6.log" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$D"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add full R2 matrix job logs [skip ci]"
          git pull --rebase origin chatgpt-stl-builder
          git push origin HEAD:chatgpt-stl-builder
