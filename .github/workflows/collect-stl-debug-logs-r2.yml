name: Collect STL Debug Logs R2
on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths: [.github/workflows/collect-stl-debug-logs-r2.yml]
permissions:
  actions: read
  contents: write
jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 0
      - name: Collect failed workflow logs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_reports/debug_logs
          gh run view 37192297909 --repo "$GITHUB_REPOSITORY" --log-failed > build_reports/debug_logs/smoke_r3_failed.log
          gh run view 37192482532 --repo "$GITHUB_REPOSITORY" --log-failed > build_reports/debug_logs/full_r2_failed.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_reports/debug_logs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add current STL build debug logs [skip ci]"
          git pull --rebase origin chatgpt-stl-builder
          git push origin HEAD:chatgpt-stl-builder
