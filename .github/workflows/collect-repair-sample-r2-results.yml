name: Collect Repair Sample R2 Results
on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths: [.github/workflows/collect-repair-sample-r2-results.yml]
permissions:
  actions: read
  contents: write
jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 0
      - name: Download reports and failed log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/sample_r2"
          mkdir -p "$D"
          gh run download 37193881671 \
            --repo "$GITHUB_REPOSITORY" \
            --name HOTS-repair-sample-r2 \
            --dir "$D"
          DEST=build_reports/repair_sample_r2
          mkdir -p "$DEST"
          find "$D" -type f -name '*.json' -exec cp {} "$DEST/" \;
          find "$D" -type f -name '*.csv' -exec cp {} "$DEST/" \;
          find "$D" -type f -name '*.txt' -exec cp {} "$DEST/" \;
          gh run view 37193881671 --repo "$GITHUB_REPOSITORY" --log-failed \
            > "$DEST/failed_run.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Add dimension-protected repair diagnostics [skip ci]"
          git pull --rebase origin chatgpt-stl-builder
          git push origin HEAD:chatgpt-stl-builder
