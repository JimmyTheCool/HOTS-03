name: Collect HOTS v6 Chunk 4 Artifact

on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths: [.github/workflows/collect-v6-chunk4-artifact.yml]

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-stl-builder
          fetch-depth: 0
      - name: Download artifact reports
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEST=build_reports/v6_chunk4
          mkdir -p "$DEST" "$RUNNER_TEMP/artifact"
          gh run download 37197433268 \
            --repo "$GITHUB_REPOSITORY" \
            --name HOTS-v6-fixed-chunk-4 \
            --dir "$RUNNER_TEMP/artifact"
          cp -r "$RUNNER_TEMP/artifact/Reports/." "$DEST/"
          find "$RUNNER_TEMP/artifact" -maxdepth 4 -type f -printf '%P\n' \
            | sort > "$DEST/artifact_file_list.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Add HOTS v6 chunk 4 reports [skip ci]"
            git pull --rebase origin chatgpt-stl-builder
            git push origin HEAD:chatgpt-stl-builder
          fi
