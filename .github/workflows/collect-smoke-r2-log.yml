name: Collect v2 Smoke R2 Log
on:
  workflow_dispatch:
  push:
    branches: [chatgpt-stl-builder]
    paths: [.github/workflows/collect-smoke-r2-log.yml]
permissions: {actions: read, contents: write}
jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: chatgpt-stl-builder, fetch-depth: 0}
      - name: Collect failed run log
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          mkdir -p build_reports/v2_smoke_r2
          gh run view 37191891876 --repo "$GITHUB_REPOSITORY" --log-failed > build_reports/v2_smoke_r2/failed_run.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_reports/v2_smoke_r2/failed_run.log
          git commit -m "Add failed v2 smoke log [skip ci]"
          git pull --rebase origin chatgpt-stl-builder
          git push origin HEAD:chatgpt-stl-builder
